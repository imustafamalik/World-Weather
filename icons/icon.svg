<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="6"/>

  <!-- Globe Ring Background -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="8" stroke-dasharray="12 8"/>
  <ellipse cx="256" cy="256" rx="170" ry="70" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="4"/>
  <line x1="256" y1="86" x2="256" y2="426" stroke="rgba(56, 189, 248, 0.18)" stroke-width="4"/>

  <!-- Sun Element -->
  <circle cx="210" cy="200" r="54" fill="url(#sunGrad)"/>
  <circle cx="210" cy="200" r="66" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4"/>

  <!-- Cloud Element -->
  <path d="M 230 330 
           L 360 330 
           A 36 36 0 0 0 360 258 
           A 48 48 0 0 0 286 220 
           A 42 42 0 0 0 230 256 
           A 38 38 0 0 0 230 330 Z" 
        fill="url(#cloudGrad)" 
        filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>

  <!-- Rain Drops / Sparkles -->
  <line x1="260" y1="350" x2="250" y2="376" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="295" y1="350" x2="285" y2="376" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>
  <line x1="330" y1="350" x2="320" y2="376" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
</svg>
